[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modem-conference"
version = "0.1.0a1"
description = "Period-inspired H.324 dial-up conferencing desktop client"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Daniel Ohnesorge"}]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Operating System :: OS Independent"]
dependencies = ["h324==0.1.0a1", "PySide6>=6.12,<6.13", "platformdirs>=4,<5"]

[project.urls]
Homepage = "https://github.com/danohn/modem-conference"
Issues = "https://github.com/danohn/modem-conference/issues"

[project.gui-scripts]
modem-conference = "modem_conference.__main__:main"

[project.scripts]
modem-conference-helper = "modem_conference.helper:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/modem_conference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
